name: Daily Accountability Check

on:
  schedule:
    # Runs at 23:30 (11:30 PM) UTC every day. Adjust to your timezone!
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

permissions:
  issues: write    # Required to open an accountability issue
  contents: read   # Required to read the repo files

jobs:
  check-daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for today's entry
        id: verify
        run: |
          TODAY=$(date +"%Y-%m-%d")
          FILE="daily/$TODAY/README.md"
          
          if [ -f "$FILE" ]; then
            # Check if file has real content (no placeholder string)
            if grep -q "Replace this" "$FILE"; then
              echo "missed=true" >> $GITHUB_OUTPUT
            else
              echo "missed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "missed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Accountability Issue
        if: steps.verify.outputs.missed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Accountability Nudge: No update for ${today}`,
              body: `Hey @${context.actor}! It looks like you haven't logged your daily learning and building yet. \n\nKeep the momentum going—write some code, update your daily log, and push your changes! \n\n*(Close this issue once you've pushed your update).*`,
              labels: ['accountability']
            })
